version: '3.8'
services:
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Remove the volume for dev-only persistence
    # In production, use a real volume or cloud storage
  fastapi:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017
volumes:
  mongo-data:
    driver: local
