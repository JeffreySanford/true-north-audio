[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "true-north-audio"
version = "0.0.1"
description = "AI-powered music generation platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "autopep8>=2.0.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.nx
  | \.venv
  | venv
  | node_modules
  | dist
  | build
  | __pycache__
  | \.egg-info
  | ai-music-gen/jukebox
  | musicgen-venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["libs", "ai-music-gen"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "ai-music-gen/jukebox",
    "node_modules",
    "dist",
    "build",
]

[tool.pytest.ini_options]
testpaths = [
    "ai-music-gen/tests",
    "ai-music-gen/musicgen",
    "libs/musicgen",
]
python_files = "test_*.py *_test.py"
addopts = "--verbose --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "fastapi: FastAPI endpoint tests",
    "ollama: Ollama service tests",
    "musicgen: MusicGen tests",
]

[tool.coverage.run]
source = ["ai-music-gen", "libs"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/jukebox/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
