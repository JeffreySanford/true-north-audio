[pytest]
# Pytest configuration for True North Audio

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths =
    ai-music-gen/tests
    ai-music-gen/musicgen
    libs/musicgen

# Add project root to Python path
pythonpath = . ai-music-gen

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    fastapi: FastAPI endpoint tests
    ollama: Ollama service tests
    musicgen: MusicGen tests

# Ignore paths
norecursedirs =
    .git
    .nx
    node_modules
    dist
    build
    __pycache__
    *.egg-info
    .venv
    venv
    ai-music-gen/jukebox
    musicgen-venv

# Output options
console_output_style = progress
log_cli = false
log_cli_level = INFO

# Test timeouts (if pytest-timeout is installed)
timeout = 300
timeout_method = thread
